# docker-compose.base-py310.yml
services:
  rebuild-gpu-service-py310: # --- CHANGE 1: New service/container name
    build:
      context: .
      dockerfile: dockerfile.base.py310 # --- CHANGE 2: Point to new Dockerfile
    image: project-rebuild-gold-standard-py310:latest # --- CHANGE 3: New image tag
    container_name: project-rebuild-gpu-service-py310

    # These runtime fixes (devices, volumes, env, etc.) are all
    # hardware-level (WSL2/ROCm 6.4.2) and are still required
    # just as they were in the Py3.12 file.
    devices:
      - /dev/dxg:/dev/dxg
    group_add:
      - video
    volumes:
      - /usr/lib/wsl/lib/libdxcore.so:/usr/lib/wsl/lib/libdxcore.so:ro
      - /opt/rocm-6.4.2/lib/libhsa-runtime64.so.1:/opt/rocm/lib/libhsa-runtime64.so.1:ro
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ipc: host
    shm_size: 8g
    environment:
      - ROCR_VISIBLE_DEVICES=0
      - HIP_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib:/opt/rocm/lib

    # --- CHANGE 4: Simplified Command ---
    # The "Checkmate Fix" (rm command) is now baked into the
    # Dockerfile, so we only need the bash shell for testing.
    command: tail -f /dev/null

    stdin_open: true
    tty: true