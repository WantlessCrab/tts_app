# docker-compose.doctr.yml
# ================================================================
# 1. DEFINE the "Immutable" GPU Fixes (YAML Anchor)
# ================================================================
x-gpu-service-config: &gpu-service-config
  devices:
    - /dev/dxg:/dev/dxg
  group_add:
    - video
  cap_add:
    - SYS_PTRACE
  security_opt:
    - seccomp:unconfined
  ipc: host
  shm_size: 8g
  environment:
    - ROCR_VISIBLE_DEVICES=0
    - HIP_VISIBLE_DEVICES=0
    - PYTHONUNBUFFERED=1
    - LD_LIBRARY_PATH=/usr/lib/wsl/lib:/opt/rocm/lib
# ===================================================================
# 2. SINGLE SERVICE - docTR OCR Only
# ===================================================================
services:
  doctr-service:
    build:
      context: .
      dockerfile: dockerfile.doctr
    container_name: project-rebuild-doctr
    <<: *gpu-service-config
    ports:
      - "8004:8000"  # Access docTR service directly on port 8003
    volumes:
      # Surgical Mounts
      - /usr/lib/wsl/lib/libdxcore.so:/usr/lib/wsl/lib/libdxcore.so:ro
      - /opt/rocm-6.4.2/lib/libhsa-runtime64.so.1:/opt/rocm/lib/libhsa-runtime64.so.1:ro
      # Data Mounts
      - ./pdf_input:/workspace/pdf_input
      - ./outputs:/workspace/outputs
      - ./pdf_cache:/workspace/pdf_cache
      - ./my_app:/app
    environment:
      - ROCR_VISIBLE_DEVICES=0
      - HIP_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib:/opt/rocm/lib
    command: >
      bash -c "
        TORCH_LIB_PATH=$$(python3 -c 'import torch; import os; print(os.path.join(os.path.dirname(torch.__file__), \"lib\"))');
        rm -f \"$$TORCH_LIB_PATH/libhsa-runtime64.so\"*;
        echo \"--- [DOCTR] Patch complete. Bundled libhsa removed.\";
        python3 -c 'import torch; import doctr; print(f\"ROCm: {torch.__version__}\"); print(\"docTR ready.\")';
        exec uvicorn doctr_service:app --host 0.0.0.0 --port 8000
      "