<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
		/* --- Base Styles matching TTS App --- */
		body {
			width: 300px;
			padding: 20px;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background: linear-gradient(135deg, #ffeaa7 0%, #dfe6e9 100%);
			margin: 0;
			color: #2d3436;
		}

		.container {
			background: rgba(255, 255, 255, 0.95);
			border-radius: 15px;
			padding: 15px;
			box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
		}

		h2 {
			color: #74b9ff;
			text-align: center;
			margin: 0 0 15px 0;
			font-weight: 300;
			font-size: 18px;
			border-bottom: 2px solid #f0f3ff;
			padding-bottom: 10px;
		}

		.status-box {
			background: linear-gradient(135deg, #a8e6cf 0%, #dcedc1 100%);
			padding: 12px;
			border-radius: 10px;
			margin-bottom: 15px;
			font-size: 13px;
			text-align: center;
			font-weight: 600;
			color: #6c5ce7;
		}

		label {
			display: block;
			color: #6c5ce7;
			margin-bottom: 8px;
			font-size: 13px;
			font-weight: 600;
		}

		select, input {
			width: 100%;
			padding: 10px;
			margin-bottom: 15px;
			background: white;
			border: 2px solid #dfe6e9;
			border-radius: 8px;
			color: #2d3436;
			font-family: inherit;
			box-sizing: border-box;
		}

		button {
			width: 100%;
			background: linear-gradient(135deg, #ffd3e1 0%, #ffb6c1 100%);
			border: none;
			padding: 12px;
			border-radius: 25px;
			color: #6c5ce7;
			cursor: pointer;
			font-size: 14px;
			font-weight: bold;
			transition: transform 0.2s;
			margin-bottom: 10px;
		}

		button:hover {
			transform: translateY(-2px);
		}

		button.stop {
			background: linear-gradient(135deg, #fab1a0 0%, #e17055 100%);
			color: white;
		}

		button.active-mode {
			border: 2px solid #6c5ce7;
		}

		/* Control Panel Styles */
		#control-panel {
			margin-top: 15px;
			padding-top: 15px;
			border-top: 2px dashed #dfe6e9;
			display: none; /* Hidden until connected */
		}

		.mode-group {
			display: flex;
			gap: 5px;
			margin-bottom: 10px;
		}

		.mode-btn {
			font-size: 11px;
			padding: 8px;
			background: #dfe6e9;
			color: #636e72;
		}

		.mode-btn.selected {
			background: #74b9ff;
			color: white;
		}

		/* Toggle Switch CSS */
		.toggle-row {
			display: flex;
			align-items: center;
			gap: 10px;
			margin-bottom: 10px;
			background: #f1f2f6;
			padding: 8px;
			border-radius: 8px;
		}

		.switch {
			position: relative;
			display: inline-block;
			width: 34px;
			height: 20px;
		}

		.switch input {
			opacity: 0;
			width: 0;
			height: 0;
		}

		.slider {
			position: absolute;
			cursor: pointer;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background-color: #ccc;
			transition: .4s;
			border-radius: 34px;
		}

		.slider:before {
			position: absolute;
			content: "";
			height: 14px;
			width: 14px;
			left: 3px;
			bottom: 3px;
			background-color: white;
			transition: .4s;
			border-radius: 50%;
		}

		input:checked + .slider {
			background-color: #00b894;
		}

		input:checked + .slider:before {
			transform: translateX(14px);
		}

    </style>
</head>
<body>
<div class="container">
    <h2>Bridge Controller</h2>

    <div class="status-box">
        Server: <span id="server-status">Checking...</span>
    </div>

    <div id="connection-section">
        <label for="agent-select">Identify This Tab As:</label>
        <select id="agent-select">
            <option value="Claude">Claude</option>
            <option value="Gemini">Gemini</option>
            <option value="ChatGPT">ChatGPT</option>
        </select>

        <button id="connect-btn">Connect Agent</button>
        <button id="disconnect-btn" class="stop" style="display:none;">Disconnect</button>
    </div>

    <div id="control-panel">
        <label>Target Agent (Receiver)</label>
        <select id="target-select">
            <option value="None">Select Target...</option>
        </select>

        <div class="toggle-row">
            <label class="switch">
                <input type="checkbox" id="toggle-next">
                <span class="slider round"></span>
            </label>
            <span>Send Next Message Only</span>
        </div>

        <div class="toggle-row">
            <label class="switch">
                <input type="checkbox" id="toggle-stream">
                <span class="slider round"></span>
            </label>
            <span>One-Way Stream (Auto)</span>
        </div>

        <div class="toggle-row">
            <label class="switch">
                <input type="checkbox" id="toggle-loop">
                <span class="slider round"></span>
            </label>
            <span>Two-Way Loop</span>
        </div>

        <div id="status-msg" style="font-size:10px; color:#aaa; margin-top:5px; text-align:center;"></div>
    </div>

</div>
<script src="popup.js"></script>
</body>
</html>
