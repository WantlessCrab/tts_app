# docker-compose.fileserver.yml

services:
  # === Service 4: File Server (CPU-Only) ===
  file-server:
    build:
      context: .
      dockerfile: dockerfile.fileserver
    container_name: project-rebuild-fileserver

    # --- Port Mapping ---
    # We map host port 8003 to the container's port 8000
    # to avoid conflicts with the api-gateway (which uses 8000).
    ports:
      - "8003:8000"

    volumes:
      - ./outputs:/workspace/outputs:ro
      - ./pdf_input:/workspace/pdf_input:ro
      - ./pdf_cache:/workspace/pdf_cache:ro
      - ./tts_models:/workspace/tts_models:ro
      - ./my_app:/app

    stdin_open: true
    tty: true