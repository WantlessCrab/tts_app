# docker-compose.pdf_only.yml

# ===================================================================
# 1. DEFINE the "Immutable" GPU Fixes (YAML Anchor)
# ===================================================================
# This anchor defines our "Gold Standard" GPU runtime configuration.
x-gpu-service-config: &gpu-service-config
  devices:
    - /dev/dxg:/dev/dxg
  group_add:
    - video
  # --- "volumes:" REMOVED FROM ANCHOR ---
  cap_add:
    - SYS_PTRACE
  security_opt:
    - seccomp:unconfined
  ipc: host
  shm_size: 8g
  environment:
    - ROCR_VISIBLE_DEVICES=0
    - HIP_VISIBLE_DEVICES=0
    - PYTHONUNBUFFERED=1
    - LD_LIBRARY_PATH=/usr/lib/wsl/lib:/opt/rocm/lib

# ===================================================================
# 2. DEFINE the Services
# ===================================================================
services:
  # === Service 1: API Gateway (CPU-Only) ===
  api-gateway:
    build:
      context: .
      dockerfile: dockerfile.gateway
    container_name: project-rebuild-gateway
    ports:
      - "8000:8000"
    volumes:
      # Mount shared volumes as read-only for this service
      - ./pdf_input:/workspace/pdf_input:ro
      - ./outputs:/workspace/outputs:ro
      - ./obsidian_audio:/workspace/obsidian_audio:ro
      - ./pdf_cache:/workspace/pdf_cache:ro
    # This service needs to know the URL of the PDF processor
    environment:
      - PDF_SERVICE_URL=http://pdf-processor-service:8000
    depends_on:
      - pdf-processor-service

  # === Service 2: PDF Processor (GPU-Enabled) ===
  pdf-processor-service:
    build:
      context: .
      dockerfile: dockerfile.pdf_processor
    container_name: project-rebuild-pdf-processor
    # Apply all the "Immutable" GPU fixes using the anchor
    <<: *gpu-service-config
    # --- "volumes:" IS NOW A MERGED LIST ---
    volumes:
      # "Surgical Mounts" (from the anchor)
      - /usr/lib/wsl/lib/libdxcore.so:/usr/lib/wsl/lib/libdxcore.so:ro
      - /opt/rocm-6.4.2/lib/libhsa-runtime64.so.1:/opt/rocm/lib/libhsa-runtime64.so.1:ro

      # "Data Mounts" (from the service)
      - ./pdf_input:/workspace/pdf_input
      - ./outputs:/workspace/outputs
      - ./pdf_cache:/workspace/pdf_cache

    # --- This is the clean, working command block ---
    command: >
      bash -c "
        # === Part 1: The "Checkmate Fix" (from base.yml) ===
        TORCH_LIB_PATH=$$(python3 -c 'import torch; import os; print(os.path.join(os.path.dirname(torch.__file__), \"lib\"))');
        rm -f \"$$TORCH_LIB_PATH/libhsa-runtime64.so\"*;
        echo \"--- [PDF-PROC] Patch complete. Bundled libhsa removed.\";
        # === Part 2: The Service Command ===
        exec uvicorn process:app --host 0.0.0.0 --port 8000
      "