# docker-compose.tts.py310.yml
# ===================================================================
# 1. DEFINE the "Immutable" GPU Fixes (YAML Anchor)
# ===================================================================
x-gpu-service-config: &gpu-service-config
  devices:
    - /dev/dxg:/dev/dxg
  group_add:
    - video
  cap_add:
    - SYS_PTRACE
  security_opt:
    - seccomp:unconfined
  ipc: host
  shm_size: 8g
  environment:
    - ROCR_VISIBLE_DEVICES=0
    - HIP_VISIBLE_DEVICES=0
    - PYTHONUNBUFFERED=1
    - LD_LIBRARY_PATH=/usr/lib/wsl/lib:/opt/rocm/lib

# ===================================================================
# 2. SINGLE SERVICE - TTS Processor Only (PY3.10)
# ===================================================================
services:
  tts-processor-service:
    build:
      context: ..
      dockerfile: ../dockerfile.tts.py310
    container_name: project-rebuild-tts-service
    <<: *gpu-service-config

    ports:
      - "8002:8000" # Access TTS service on host port 8002

    volumes:
      # Surgical Mounts
      - /usr/lib/wsl/lib/libdxcore.so:/usr/lib/wsl/lib/libdxcore.so:ro
      - /opt/rocm-6.4.2/lib/libhsa-runtime64.so.1:/opt/rocm/lib/libhsa-runtime64.so.1:ro

      # TTS Model Cache
      - ./tts_models:/root/.local/share/tts
      # Live updates from codebase edits
      - ./my_app:/app

    command: [ "python3", "-m", "TTS.server.server", "--model_name", "tts_models/en/ljspeech/tacotron2-DDC", "--port", "8000" ]

    stdin_open: true
    tty: true