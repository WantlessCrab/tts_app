# docker-compose.relay.yml

services:
  llm-relay-service:
    build:
      context: .
      dockerfile: dockerfile.relay
    container_name: relay
    ports:
      - "8005:8005"
    volumes:
      - ./feature_llm_bridge/backend:/app
      - ./certs:/app/certs:ro
    environment:
      - PYTHONUNBUFFERED=1
      - HOST_GATEWAY=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true

    command: >
      uvicorn router:app 
      --host 0.0.0.0 
      --port 8005 
      --ssl-keyfile /app/certs/key.pem 
      --ssl-certfile /app/certs/cert.pem
      --reload